<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JourneyPath — Feedback &amp; Erfahrungsberichte</title>
    <meta name="description" content="Verwalte dein Feedback und persönliche Erfahrungsberichte zu verschiedenen Kandidaten. Synchronisiert mit SilverBullet.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <header class="app-header">
        <div class="header-container">
            <div class="brand">
                <div class="logo-icon">
                    <i data-lucide="compass"></i>
                </div>
                <div>
                    <h1>JourneyPath</h1>
                    <div class="journey-selector">
                        <button class="btn-journey-dropdown" id="journeyDropdownBtn">
                            <span id="currentJourneyName">bike</span>
                            <i data-lucide="chevron-down" style="width: 12px; height: 12px;"></i>
                        </button>
                        <div class="journey-dropdown-menu hidden" id="journeyDropdownMenu">
                            <div class="dropdown-header">Meine Kaufreisen</div>
                            <div id="recentJourneysList"></div>
                            <div class="dropdown-divider"></div>
                            <button class="dropdown-item" id="createJourneyBtn">
                                <i data-lucide="plus" style="width: 14px; height: 14px; margin-right: 6px;"></i>
                                Neue Kaufreise...
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <nav class="header-nav">
                <a href="index.html" class="nav-link">
                    <i data-lucide="layout-dashboard"></i> Dashboard
                </a>
                <a href="compare.html" class="nav-link">
                    <i data-lucide="git-compare"></i> Vergleich
                </a>
                <a href="feedback.html" class="nav-link active">
                    <i data-lucide="message-square"></i> Feedback
                </a>
                <a href="specs.html" class="nav-link">
                    <i data-lucide="sliders"></i> Eigenschaften
                </a>
            </nav>
            
            <div class="header-actions">
                <div class="sync-status" id="syncStatus">
                    <span class="status-dot green"></span>
                    <span class="status-text">Verbunden mit SilverBullet</span>
                </div>
                <button id="refreshBtn" class="btn btn-icon-only" title="Daten neu laden">
                    <i data-lucide="refresh-cw"></i>
                </button>
                <a href="https://notes.wohnli.com" target="_blank" class="btn btn-secondary">
                    <i data-lucide="external-link"></i> SilverBullet öffnen
                </a>
            </div>
        </div>
    </header>

    <main class="feedback-layout">
        <div class="workspace-header">
            <div class="title-with-count">
                <i data-lucide="message-square"></i>
                <h2>Feedback &amp; Erfahrungsberichte</h2>
                <span class="badge" id="feedbackCount">0</span>
            </div>
        </div>

        <!-- Grid of Feedback Units (One card per person) -->
        <div class="feedback-grid" id="feedbackGrid">
            <!-- Dynamic Content loaded from SilverBullet -->
        </div>
    </main>

    <!-- Create Journey Modal -->
    <div class="modal-overlay hidden" id="journeyModal">
        <div class="modal card" style="max-width: 400px;">
            <div class="modal-header">
                <h3>Neue Kaufreise anlegen</h3>
                <button class="btn btn-icon-only close-modal" id="closeJourneyModalBtn">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <form id="journeyForm">
                <div class="form-group">
                    <label for="newJourneyId">Kürzel / Name *</label>
                    <input type="text" id="newJourneyId" class="form-control" placeholder="z.B. laptop, fernseher" required pattern="[a-z0-9.-]+">
                    <small class="text-muted" style="margin-top: 4px; display: block;">Wird für den Dateinamen verwendet (z.B. laptop.buying-journey.md)</small>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancelJourneyModalBtn">Abbrechen</button>
                    <button type="submit" class="btn btn-primary">Starten</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div class="toast hidden" id="toast">
        <i data-lucide="info" class="toast-icon"></i>
        <span class="toast-message" id="toastMessage">Daten gespeichert</span>
    </div>

    <script src="navigation.js"></script>
    <script src="feedback.js"></script>
</body>
</html>
